analyze_user_task:
  description: >
    Use the input user_id: {user_id}.

    IMPORTANT FOR THE MANAGER:
    Assign this task to the User Preference Researcher.

    Analyze this user by searching the user and review JSON files.

    CRITICAL TOOL USAGE RULE:
    Every retrieval tool call MUST use the key "search_query".

    Correct examples:
    {"search_query": "user_id: {user_id} average_stars review_count yelping_since useful funny cool"}
    {"search_query": "user_id: {user_id} stars text date"}

    Incorrect examples:
    {"user_id": "{user_id}"}
    {"user_id": "{user_id}", "limit": 10}

    Your job is to summarize:
    - the user's preferences
    - rating tendencies
    - sentiment style
    - writing style

    You should use both:
    - user metadata evidence
    - the user's historical review evidence

    Return the result in markdown format.

  expected_output: >
    A markdown report describing the user's profile, preferences, rating habits,
    and review-writing behavior.


analyze_item_task:
  description: >
    Use the input item_id: {item_id}.

    IMPORTANT FOR THE MANAGER:
    Assign this task to the Item Researcher.

    Analyze this item by searching the item and review JSON files.

    CRITICAL TOOL USAGE RULE:
    Every retrieval tool call MUST use the key "search_query".

    Correct examples:
    {"search_query": "item_id: {item_id} name categories stars review_count attributes hours city state"}
    {"search_query": "item_id: {item_id} stars text date"}

    Incorrect examples:
    {"item_id": "{item_id}"}
    {"item_id": "{item_id}", "limit": 10}

    Your job is to summarize:
    - the item's strengths
    - weaknesses
    - common opinions
    - overall customer sentiment
    - important metadata signals

    You should use both:
    - item metadata evidence
    - historical review evidence for the item

    Return the result in markdown format.

  expected_output: >
    A markdown report describing the item's characteristics, strengths,
    weaknesses, and common customer feedback.


predict_review_task:
  description: >
    Use the outputs of analyze_user_task and analyze_item_task.

    This is NOT a schema-explanation task.
    This is NOT a data-format-description task.
    This is NOT a question-answering task.

    Your only job is to predict the most plausible Yelp-style final review
    for this exact user-item pair using the previous task outputs.

    Required output:
    - valid JSON only
    - exactly two keys: "stars" and "review"
    - no markdown
    - no explanation
    - no triple backticks
    - no extra keys

    Constraints:
    - stars must be between 0.5 and 5.0
    - stars must use 0.5 increments
    - review must be realistic and consistent with the predicted stars
    - use only evidence from the previous task outputs
    - do not discuss schema, structure, or field definitions

    Return exactly:
    {
      "stars": number,
      "review": string
    }

  expected_output: >
    A valid JSON object with exactly two fields: "stars" and "review".