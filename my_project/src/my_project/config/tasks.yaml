analyze_user_task:
  description: >
    Use the input user_id: {user_id}.

    IMPORTANT:
    - You MUST only use records whose user_id exactly equals {user_id}
    - Ignore any near match or unrelated retrieval hit
    - Your final user analysis must clearly restate the exact user_id

    Analyze this user by searching the user and review JSON files.

    CRITICAL TOOL USAGE RULE:
    Every retrieval tool call MUST use the key "search_query".

    Correct examples:
    {"search_query": "user_id: {user_id} average_stars review_count yelping_since useful funny cool"}
    {"search_query": "user_id: {user_id} stars text date"}

    Incorrect examples:
    {"user_id": "{user_id}"}
    {"user_id": "{user_id}", "limit": 10}

    Return the result in markdown format.

  expected_output: >
    A markdown report describing the exact target user, including:
    - exact user_id
    - preferences
    - rating habits
    - sentiment style
    - writing style


analyze_item_task:
  description: >
    Use the input item_id: {item_id}.

    IMPORTANT:
    - You MUST only use records whose item_id exactly equals {item_id}
    - Ignore every result whose item_id does not exactly match {item_id}
    - Do NOT summarize other businesses
    - Your final answer must explicitly restate:
      - exact item_id
      - exact business name
      - exact stars
      - exact review_count

    Analyze this item by searching the item and review JSON files.

    Every retrieval tool call MUST use the key "search_query".

    Correct examples:
    {"search_query": "item_id: {item_id} name categories stars review_count attributes hours city state"}
    {"search_query": "item_id: {item_id} stars text date"}

  expected_output: >
    A markdown report for the exact requested item_id only.

predict_review_task:
  description: >
    Use the outputs of analyze_user_task and analyze_item_task.

    IMPORTANT FOR THE MANAGER:
    - Delegate this task only to PredictionAnalyst
    - Use delegate_work_to_coworker, not ask_question_to_coworker
    - Pass the full validated user summary and full validated item summary
    - Do not shorten the context into one vague sentence
    - Do not change the business name or item_id

    Required output:
    - raw JSON only
    - exactly two keys: "stars" and "review"
    - no markdown
    - no explanation
    - no triple backticks
    - no extra keys

    Return exactly:
    {"stars": number, "review": string}

  expected_output: >
    A valid JSON object with exactly two fields: "stars" and "review".